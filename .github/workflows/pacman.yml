name: Generate Pac-Man

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Apply Tokyo Night colors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Paleta Tokyo Night
          replacements = {
              "#161b22": "#1a1b26",
              "#0d1117": "#1a1b26",

              "#ebedf0": "#24283b",
              "#9be9a8": "#414868",
              "#40c463": "#7aa2f7",
              "#30a14e": "#bb9af7",
              "#216e39": "#7dcfff",

              "#39d353": "#9ece6a",
          }

          for file in Path("dist").glob("*.svg"):
              content = file.read_text()

              for old, new in replacements.items():
                  content = content.replace(old, new)

              file.write_text(content)
              print(f"✓ Tokyo Night aplicado: {file}")
          PY

      - name: Push Pac-Man to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
